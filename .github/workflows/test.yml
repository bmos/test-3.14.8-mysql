name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

jobs:
  pytest:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.14.7'
          - '3.14.8'
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        env:
          UV_MANAGED_PYTHON: true
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - run: uv sync

      - run: python -c "import ssl; print(ssl.OPENSSL_VERSION)"

      - run: pytest
